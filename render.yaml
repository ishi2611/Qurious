# Render Blueprint for the API (alternative to Hugging Face Spaces).
# Fits Render's free 512 MB instance (ONNX embeddings, Qiskit loaded only for hardware runs).
# Free instances sleep after 15 minutes idle; the first request then takes about a minute.
services:
  - type: web
    name: qurious-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false # e.g. ["https://qurious.vercel.app"]
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STUDY_ENABLED
        value: "false"
      - key: STUDY_ADMIN_TOKEN
        sync: false
      - key: IBM_QUANTUM_TOKEN
        sync: false
