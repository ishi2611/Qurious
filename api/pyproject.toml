[project]
name = "qurious-api"
version = "0.1.0"
description = "Backend for Qurious: path engine, content, tutor layer and study data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "qiskit>=2.0",        # validates our TypeScript simulator; optional real-hardware runs
    "qiskit-aer>=0.17",
    "networkx>=3.3",      # concept map and path engine
    "pyyaml>=6.0",        # content files
    "requests>=2.32",     # LLM provider HTTP calls
    "sentence-transformers>=5.0",  # local embeddings for retrieval (no paid API)
    "chromadb>=1.0",      # vector search over lesson content
    "qiskit-ibm-runtime>=0.50",  # optional real-hardware runs (needs IBM_QUANTUM_TOKEN)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.13",  # used by FastAPI's TestClient (Starlette now prefers httpx2 over httpx)
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real embedding model (downloads ~90 MB on first run)"]
addopts = "-m 'not slow'"
